services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: uzina-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: uzina
      POSTGRES_PASSWORD: uzina
      POSTGRES_DB: uzina_dev
    volumes:
      - uzina_pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzina -d uzina_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uzina_pgdata:
