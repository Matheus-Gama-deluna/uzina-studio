services:
  caddy:
    image: caddy:2-alpine
    container_name: uzina-caddy
    restart: unless-stopped
    depends_on:
      uzina:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      UZINA_DOMAIN: "${UZINA_DOMAIN:?Defina UZINA_DOMAIN no .env (ex.: studio.seudominio.com)}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - uzina_caddy_data:/data
      - uzina_caddy_config:/config

  # Opcional: TTS self-hosted gratuito na VPS (Kokoro-82M compatível com OpenAI /v1/audio/speech)
  # Ative com: docker compose -f docker-compose.yml -f docker-compose.vps.yml --profile voice-local up -d
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: uzina-kokoro-tts
    profiles: ["voice-local"]
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8880:8880"

  # Opcional: Proxy restrito de Docker socket para sandbox isolado (perfil sandbox)
  # Ative com: docker compose -f docker-compose.yml -f docker-compose.vps.yml --profile sandbox up -d
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: uzina-docker-proxy
    profiles: ["sandbox"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: "1"
      INFO: "1"
      VERSION: "1"
      IMAGES: "0"
      POST: "1"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      SWARM: "0"
      AUTH: "0"
      SECRETS: "0"
      SYSTEM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - uzina_sandbox_ctl

volumes:
  uzina_caddy_data:
  uzina_caddy_config:

networks:
  uzina_sandbox_ctl:
    internal: true
